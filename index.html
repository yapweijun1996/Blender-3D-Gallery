<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="" />
    <meta name="color-scheme" content="" />
    <!-- Exact style hashes permit the built-in browser's annotation overlay and cursor styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      data-production-csp
      content="default-src 'none'; script-src 'self'; style-src 'self' 'sha256-62lPaUtpvg47KrxPOXYc0Ki8fkE6PNsbY5I9DpyEwZ4=' 'sha256-OUoShR0c3lqWNHEaHdorwfYnp/0EJHI/7QhTEUtan9w='; img-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'"
    />
    <!-- palette-bootstrap -->
    <meta
      name="description"
      data-i18n-content="shell.description"
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Blender 3D Gallery</title>
    <!-- language-bootstrap -->
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="shell.skip"></a>
    <div class="topbar">
      <header class="header shell">
        <a class="brand" href="./" data-i18n-aria-label="shell.brandHome" aria-describedby="topbar-version">
          <span class="brand-mark">✳</span>
          <span>
            BLENDER <i>3D</i> GALLERY
            <span class="brand-meta">
              <small data-i18n="shell.brandTagline"></small>
              <span id="topbar-version" class="version-chip" data-app-version></span>
            </span>
          </span>
        </a>
        <nav class="desktop-nav" data-i18n-aria-label="shell.navigation">
          <a href="?page=models" data-page="gallery" data-i18n="nav.models"></a
          ><a href="?page=demos" data-page="demos" data-i18n="nav.demos"></a
          ><a href="?page=about" data-page="about" data-i18n="nav.about"></a
          ><a
            class="source-link"
            href="https://github.com/yapweijun1996/Blender-3D-Gallery"
            >GitHub <span aria-hidden="true">↗</span></a
          >
        </nav>
        <div class="topbar-actions">
          <button class="outline-button palette-trigger" type="button" data-open-palette hidden aria-haspopup="dialog" aria-controls="palette-picker" aria-expanded="false"></button>
          <button class="outline-button language-trigger" type="button" data-open-language hidden aria-haspopup="dialog" aria-controls="language-picker" aria-expanded="false"></button>
          <button class="outline-button topbar-update" type="button" data-pwa-update hidden>
            <span class="topbar-update-short"></span><span class="topbar-update-full"></span>
          </button>
          <button
            id="menu-trigger"
            class="outline-button menu-trigger"
            type="button"
            aria-haspopup="dialog"
            aria-controls="mobile-menu"
            aria-expanded="false"
            data-i18n="shell.menu"
          ></button>
        </div>
      </header>
    </div>
    <dialog id="mobile-menu" aria-labelledby="menu-title">
      <div class="menu-heading">
        <h2 id="menu-title" data-i18n="shell.menuTitle"></h2>
        <button
          id="close-menu"
          class="icon-button"
          data-i18n-aria-label="shell.closeMenu"
        >
          ×
        </button>
      </div>
      <nav data-i18n-aria-label="shell.mobileNavigation">
        <a href="?page=models" data-page="gallery" data-i18n="nav.models"></a
        ><a href="?page=demos" data-page="demos" data-i18n="nav.demos"></a
        ><a href="?page=about" data-page="about" data-i18n="nav.about"></a
        ><a href="https://github.com/yapweijun1996/Blender-3D-Gallery"
          >GitHub ↗</a
        >
        <div class="menu-preferences">
          <button class="outline-button palette-trigger" type="button" data-open-palette hidden aria-haspopup="dialog" aria-controls="palette-picker" aria-expanded="false"></button>
          <button class="outline-button language-trigger" type="button" data-open-language hidden aria-haspopup="dialog" aria-controls="language-picker" aria-expanded="false"></button>
        </div>
      </nav>
      <div class="menu-version">
        <span class="version-chip" data-app-version></span>
        <button class="outline-button topbar-update" type="button" data-pwa-update hidden></button>
      </div>
    </dialog>
    <dialog id="palette-picker" aria-labelledby="palette-title">
      <div class="palette-heading">
        <h2 id="palette-title"></h2>
        <button class="icon-button" type="button">×</button>
      </div>
      <div class="palette-options" role="radiogroup" aria-labelledby="palette-title"></div>
    </dialog>
    <dialog id="language-picker" aria-labelledby="language-title">
      <div class="palette-heading">
        <h2 id="language-title" data-i18n="language.choose"></h2>
        <button class="icon-button" type="button" data-i18n-aria-label="language.close">×</button>
      </div>
      <div class="language-options" role="radiogroup" aria-labelledby="language-title"></div>
    </dialog>
    <div id="main-content" tabindex="-1"></div>
    <p id="route-notice" class="shell route-notice" role="status" hidden><span id="route-notice-text"></span></p>
    <main id="gallery-page" class="shell">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-discovery">
          <h1 id="intro-title"><span data-i18n="gallery.heroFirst"></span><br /><em data-i18n="gallery.heroSecond"></em></h1>
          <p class="intro-copy" data-i18n="gallery.heroDescription"></p>
          <div class="explore-links">
            <a
              class="outline-button"
              href="?page=models#collection"
              data-page="gallery"
              ><span data-i18n="gallery.browse"></span> <span aria-hidden="true">↓</span></a
            ><a class="text-link" href="?page=demos" data-page="demos"
              ><span data-i18n="gallery.exploreDemos"></span> <span aria-hidden="true">↗</span></a
            >
          </div>
        </div>
        <a id="featured-model" class="hero-model" hidden>
          <span class="hero-frame"></span>
          <span class="hero-caption">
            <span><small data-i18n="gallery.featured"></small><strong></strong></span>
            <span class="hero-view" aria-hidden="true" data-i18n="gallery.view"></span>
          </span>
        </a>
      </section>
      <section id="collection" class="collection" aria-labelledby="collection-title">
        <div class="library-heading">
          <h2 id="collection-title" data-i18n="library.title"></h2>
          <h1 id="library-page-title" tabindex="-1" hidden data-i18n="library.title"></h1>
          <p id="model-count" class="result-count" role="status" aria-live="polite"></p>
        </div>
        <form id="model-filters" class="browse-controls" role="search" data-i18n-aria-label="library.searchLabel">
          <div class="library-search-row">
            <label class="search-field" for="model-search">
              <span class="search-label" data-i18n="library.search"></span>
              <input id="model-search" name="q" type="search" data-i18n-placeholder="library.searchPlaceholder" autocomplete="off" />
            </label>
            <button id="filter-toggle" class="outline-button" type="button" aria-expanded="false" aria-controls="advanced-filters">
              <span data-i18n="library.filters"></span><span id="filter-count" hidden></span>
            </button>
          </div>
          <div id="advanced-filters" hidden>
            <label for="model-theme"><span data-i18n="library.category"></span>
              <select id="model-theme" name="theme"><option value="" data-i18n="library.allCategories"></option></select>
            </label>
            <label for="model-category"><span data-i18n="library.subject"></span>
              <select id="model-category" name="category"><option value="" data-i18n="library.allSubjects"></option></select>
            </label>
            <label for="model-collection"><span data-i18n="library.collection"></span>
              <select id="model-collection" name="collection"><option value="" data-i18n="library.allCollections"></option></select>
            </label>
            <label for="model-feature"><span data-i18n="library.feature"></span>
              <select id="model-feature" name="feature">
                <option value="" data-i18n="library.allFeatures"></option>
                <option value="animated" data-i18n="library.animated"></option>
                <option value="interactive" data-i18n="library.interactive"></option>
              </select>
            </label>
          </div>
        </form>
        <div class="library-shortcuts">
          <nav id="category-navigation" class="category-navigation" data-i18n-aria-label="library.categories"></nav>
          <button id="clear-model-filters" type="reset" form="model-filters" hidden data-i18n="library.clear"></button>
        </div>
        <div id="catalog" class="catalog">
          <p role="status" data-i18n="library.loading"></p>
        </div>
        <noscript><p data-i18n="library.noScript"></p></noscript>
      </section>
    </main>
    <main id="demos-page" class="shell" hidden>
      <section class="index-intro">
        <h1 tabindex="-1"><span data-i18n="nav.demos"></span><span class="period" data-i18n="common.period"></span></h1>
        <p data-i18n="demos.intro"></p>
      </section>
      <form
        id="demo-filters"
        class="browse-controls"
        role="search"
        data-i18n-aria-label="demos.searchLabel"
      >
        <label class="search-field" for="demo-search"
          ><span data-i18n="demos.search"></span><input
            id="demo-search"
            name="dq"
            type="search"
            data-i18n-placeholder="demos.searchPlaceholder"
            autocomplete="off" /></label
        ><label for="demo-category"
          ><span data-i18n="library.category"></span><select id="demo-category" name="dc">
            <option value="" data-i18n="library.allCategories"></option>
          </select></label
        ><button class="outline-button" type="reset" data-i18n="library.clear"></button>
      </form>
      <p
        id="demo-count"
        class="result-count"
        role="status"
        aria-live="polite"
      ></p>
      <div id="demo-catalog" class="demo-grid">
        <p role="status" data-i18n="demos.loading"></p>
      </div>
    </main>
    <main id="about-page" class="shell" hidden>
      <section id="about" class="index-intro">
        <p class="eyebrow" data-i18n="about.eyebrow"></p>
        <h1 tabindex="-1"><span data-i18n="about.heading"></span><span class="period" data-i18n="common.period"></span></h1>
        <p data-i18n="about.intro"></p>
        <p data-i18n="about.experiences"></p>
        <p data-i18n="about.rights"></p>
        <a class="text-link" href="?page=models" data-page="gallery"
            data-i18n="about.explore"
        ></a
        >
      </section>
    </main>
    <div id="demo-breadcrumb" class="shell demo-breadcrumb" hidden>
      <a class="text-link" href="?page=demos" data-page="demos"
        data-i18n="demos.back"
      ></a
      >
    </div>
    <main id="game-page" class="shell" hidden></main>
    <main id="solar-page" class="shell" hidden></main>
    <main id="product-studio-page" class="shell" hidden></main>
    <main id="chibi-motion-page" class="shell" hidden></main>
    <main id="tripo-motion-page" class="shell" hidden></main>
    <main id="shelf-inspector-page" class="shell" hidden></main>
    <footer class="shell footer">
      <span>✳ &nbsp; BLENDER 3D GALLERY</span
      ><span data-i18n="shell.footer"></span
      ><a href="https://github.com/yapweijun1996/Blender-3D-Gallery"
        data-i18n="shell.source"
      ></a
      >
    </footer>
    <dialog id="viewer" aria-labelledby="viewer-title">
      <div class="viewer-header">
        <div>
          <p id="viewer-category" class="eyebrow" data-i18n="viewer.object"></p>
          <h2 id="viewer-title" data-i18n="viewer.asset"></h2>
        </div>
        <button
          id="close-viewer"
          class="icon-button"
          type="button"
          data-i18n-aria-label="viewer.close"
        >
          ×
        </button>
      </div>
      <div id="viewport" class="viewport">
        <img id="viewer-poster" class="viewer-poster" alt="" />
        <p id="viewer-status" class="viewer-status" role="status" data-i18n="viewer.loading"></p>
      </div>
      <div class="viewer-footer">
        <p data-i18n="viewer.help"></p>
        <div class="viewer-actions">
          <button id="retry-view" type="button" hidden data-i18n="viewer.retry"></button
          ><button id="fullscreen-view" type="button" hidden data-i18n="common.fullscreen"></button
          ><button id="reset-view" type="button" disabled data-i18n="viewer.reset"></button>
        </div>
      </div>
      <dl id="viewer-metadata" class="viewer-metadata"></dl>
      <div class="viewer-details">
        <p id="viewer-description" class="viewer-description"></p>
        <a id="viewer-download" class="viewer-download" download
           data-i18n="library.download"></a
        >
      </div>
      <div id="viewer-related" class="viewer-related"></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
