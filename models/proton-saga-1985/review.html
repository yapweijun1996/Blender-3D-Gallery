<h1>Proton Saga</h1>
<p>左侧是你提供的参考图；右侧是同一个 Blender 模型的实际渲染。车型按图片重建，仍不是实车扫描或完全一致的照片级模型。大灯与尾灯使用参考图局部纹理，轮圈采用实体几何。</p>
