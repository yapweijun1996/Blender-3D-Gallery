<h1>Stacked Can Pyramid · P1</h1>
<p>1.0 × 1.4 × 1.0 m · 91 cans · 6,988 triangles including collider · 2 materials</p>
<main></main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const files = await Promise.all(['optimized.glb','optimized-variant-b.glb'].map(name => new GLTFLoader().loadAsync('../exports/'+name)));
const records = [];
for (const [variant, view] of [[0,'Front'],[1,'Front'],[0,'Three-quarter'],[1,'Three-quarter']]) {
 const label = `${variant ? 'Jade / variant_b' : 'Coral / variant_a'} · ${view}`;
 const section = document.createElement('section');
 section.innerHTML = `<h2>${label}</h2>`;
 document.querySelector('main').append(section);
 const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1); renderer.setClearColor(0xd9d4c9);
 section.append(renderer.domElement);
 const scene = new THREE.Scene(), pmrem = new THREE.PMREMGenerator(renderer), room = new RoomEnvironment();
 const env = pmrem.fromScene(room,.04);
 scene.environment = env.texture; scene.environmentIntensity = .6;
 scene.add(new THREE.HemisphereLight(0xffffff,0x535b53,2));
 const light = new THREE.DirectionalLight(0xffffff,2.1);
 light.position.set(4,7,5); scene.add(light);
 const model = files[variant].scene.clone(true); scene.add(model);
 const camera = new THREE.OrthographicCamera(-1.1,1.1,1,-1,.01,100);
 camera.position.copy(view === 'Front' ? new THREE.Vector3(0,.7,5) : new THREE.Vector3(3,2.5,4));
 camera.lookAt(0,.7,0);
 const width = section.clientWidth, height = Math.round(width/1.1);
 renderer.setSize(width,height,false);
 camera.left = -1.0*width/height; camera.right = 1.0*width/height; camera.updateProjectionMatrix();
 renderer.render(scene,camera);
 records.push({label,variant:variant ? 'variant_b':'variant_a',view,draw_calls_model_only:renderer.info.render.calls,
  rendered_triangles:renderer.info.render.triangles,collider_visible:!!model.getObjectByName('collider_box'),
  dimensions_metres:new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).toArray(),
  canvas:[width,height],context_lost:renderer.getContext().isContextLost()});
 pmrem.dispose();room.dispose();
}
window.qaResults={ready:true,records};
</script>
