<html lang="en"><head><meta charset="utf-8"><title>GLB views</title>
<style>html,body{margin:0;background:#ebeaf7}canvas{display:block}</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// Four views (front, three-quarter, side, back) of one GLB, framed by its bounding box, in one canvas.
const q = new URLSearchParams(location.search); const S = 560;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(S * 4, S); document.body.appendChild(r.domElement); r.setScissorTest(true); r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xebeaf7);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d8ea, 2.2));
const key = new THREE.DirectionalLight(0xfff6ee, 1.6); key.position.set(-1.3, 2.3, 2.2); scene.add(key);
const gltf = await new GLTFLoader().loadAsync(q.get('glb')); scene.add(gltf.scene);
const box = new THREE.Box3().setFromObject(gltf.scene); const c = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3());
window.__info = { size: size.toArray().map((v) => +v.toFixed(3)), centre: c.toArray().map((v) => +v.toFixed(3)) };
const cam = new THREE.PerspectiveCamera(22, 1, 0.01, 50); const dist = (size.y * 0.62) / Math.tan(THREE.MathUtils.degToRad(11));
const angles = [0, 35, 90, 180];
angles.forEach((az, i) => {
  const a = THREE.MathUtils.degToRad(az); cam.position.set(c.x + Math.sin(a) * dist, c.y + size.y * 0.05, c.z + Math.cos(a) * dist); cam.lookAt(c);
  r.setViewport(i * S, 0, S, S); r.setScissor(i * S, 0, S, S); r.render(scene, cam);
});
// Read the preserved WebGL drawing buffer directly. A headless compositor
// screenshot can be blank even when the renderer has loaded the model.
window.captureTurnaround = () => {
  const gl = r.getContext();
  if (gl.isContextLost()) throw Error('WebGL context lost before capture');
  const pixels = new Uint8Array(S * S * 4);
  for (const [i, angle] of angles.entries()) {
    gl.readPixels(i * S, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let visible = 0;
    for (let p = 0; p < pixels.length; p += 4) {
      if (Math.max(Math.abs(pixels[p] - pixels[0]), Math.abs(pixels[p + 1] - pixels[1]),
        Math.abs(pixels[p + 2] - pixels[2])) > 10) visible++;
    }
    if (visible < S * S * .005) throw Error('Empty turnaround view at ' + angle + ' degrees');
  }
  return r.domElement.toDataURL('image/png');
};
window.__ready = true;
</script></body></html>
