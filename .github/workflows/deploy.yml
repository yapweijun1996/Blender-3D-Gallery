name: Build and deploy gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_assets:
        description: Force a fresh site build before deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      # Start with catalog/code and two commits; hydrate all tracked files only for full verification.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/models/
            !/docs/
            !/output/
            !/tests/
            !/.agents/
            !/.tripo/
            /models/catalog.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Select verification lane
        id: gate
        run: node scripts/static-model-verification.mjs classify
      - name: Hydrate full verification inputs
        if: steps.gate.outputs.mode != 'fast'
        run: git sparse-checkout disable
      - run: npm ci --no-audit --no-fund
      - name: Verify one static model and catalog
        if: steps.gate.outputs.mode == 'fast'
        env:
          BASE: ${{ steps.gate.outputs.base }}
          MODEL: ${{ steps.gate.outputs.model }}
        run: |
          node scripts/check-i18n.mjs
          node scripts/static-model-verification.mjs verify "$BASE" "$MODEL"
      - run: npm test
        if: steps.gate.outputs.mode != 'fast'
      - run: npm run test:world
        if: steps.gate.outputs.mode != 'fast'
      - run: npm run validate:assets
        if: steps.gate.outputs.mode != 'fast'
  build:
    needs: verify
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/models/
            !/docs/
            !/output/
            !/tests/
            !/.agents/
            !/.tripo/
            /models/catalog.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Select deployment inputs
        id: inputs
        run: node scripts/deployment-inputs.mjs
      - name: Restore identical site build
        id: site
        if: inputs.validate_assets != true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist
          key: ${{ steps.inputs.outputs.cache_key }}
      - name: Download selected model resources
        if: steps.site.outputs.cache-hit != 'true' || inputs.validate_assets
        run: git sparse-checkout set --no-cone --stdin < /tmp/gallery-deployment-patterns
      - run: npm ci --no-audit --no-fund
        if: steps.site.outputs.cache-hit != 'true' || inputs.validate_assets
      - run: npm run build:deploy
        if: steps.site.outputs.cache-hit != 'true' || inputs.validate_assets
      - id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist
  deploy:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
